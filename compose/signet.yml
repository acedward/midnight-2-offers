# signet — the MPC responder that makes the `aa` profile's bridge vault REAL.  Profile: `signet`
#
#   ./up.sh --with aa --with signet          (up.sh/down.sh pick this fragment up by filename)
#
# In this repo a profile IS the compose fragment filename, and `profiles:` is deliberately NOT
# used here for the same reason compose/evm.yml explains: up.sh adds `-f compose/<name>.yml` for
# `--with <name>` and never passes `--profile`, so a service carrying a compose profile key would
# silently never start.
#
# WHAT THIS PROFILE IS FOR. Without it, `aa-deploy` initialises the bridge vault against a STUB
# MPC root key derived from the public string `AA_DOMAIN` (docs/KNOWN-LIMITATIONS.md): the bridge
# circuits are deployed, nothing can move funds across them, and that is correct for a disposable
# localnet. With it, `aa-deploy` generates a PER-STACK root secret, initialises the vault against
# its public half and pins the vault to a REAL EVM chain (Sepolia, 11155111, by default), and this
# fragment runs the responder that holds the other half of that key and signs on that chain.
#
# ONE service, because everything else it would have needed already exists:
#
#   signet-fakenet   our patched fakenet MPC responder (images/signet-fakenet/, built from
#                    acedward/solana-signet-program @ a1a7798 = fork PR #1). It watches the
#                    singleton `aa-deploy` deployed, serves ONLY the vault `aa-deploy` deployed
#                    (MIDNIGHT_CALLER_ALLOWLIST, 00034 question Q64), signs with the per-stack
#                    root key, broadcasts on the operator's Sepolia RPC and posts the attestation
#                    back on Midnight.
#
# There is deliberately NO key-generation one-shot and NO funding one-shot:
#
#   * the root secret is generated by `aa-deploy` itself, into /aa/out/signet-root.env on the
#     `aa-out` volume, because aa-deploy is the EARLIER consumer (it has to initialise the vault
#     against the public half) and already owns that volume. A separate one-shot would have to be
#     ordered ahead of a service declared in another fragment, which means overlaying aa.yml's
#     `depends_on` from here and making the fragment ORDER load-bearing. See questions Q12.
#   * the responder's Midnight wallet is funded by `up.sh`, exactly like the aa-console relay
#     wallet and the aa-taker wallet, through scripts/fund-wallet.sh. `MidnightMonitor`'s
#     responder wallet is built LAZILY on the first request, so the container starts fine before
#     the funding lands.
#
# ⚠ SECURITY POSTURE, stated where it is configured. The stack holds BOTH halves of the MPC root
# key, so this is a demo-grade bridge: it proves the protocol end to end, not a signer nobody here
# controls. And the attestation is recovered by an `eth_call` REPLAY rather than a mined trace
# whenever the RPC has no `debug` namespace (the owner's Alchemy free tier has none) — see the
# image's Dockerfile and 00034 question Q62. Both facts travel with every artefact this profile
# produces.
#
# ⚠ TWO OPERATOR SECRETS, both read at run time from the uncommitted .env and NEVER committed:
#     SIGNET_EVM_RPC_URL     the Sepolia endpoint (keyed). up.sh fails fast when it is empty.
#     FRONTEND_WALLET_SEED   (frontend profile) the owner's wallet, when the demo wants one.
#
# NO HOST PORT. The responder's helper API (GET /responses/{requestId}) listens on the container's
# :3040 and is reached over the compose network only — it is a convenience for clients that have
# no debug_traceTransaction of their own, never an authority, and publishing it would put an
# unauthenticated view of this stack's bridge traffic on the host.

services:
  signet-fakenet:
    image: '${SIGNET_FAKENET_IMAGE:-midnight-2-offers/signet-fakenet:local}'
    build:
      context: '../images/signet-fakenet'
      args:
        # Our fork of sig-net/solana-signet-program. A FULL 40-hex commit, not a branch: the
        # responder's identity is the two local patches, and "the tip of a branch" is not an
        # identity. The image asserts both patches are present at build time.
        SIGNET_FAKENET_REPO: '${SIGNET_FAKENET_REPO:-https://github.com/acedward/solana-signet-program.git}'
        SIGNET_FAKENET_REF: '${SIGNET_FAKENET_REF:-a1a7798f35cab07d5279cfd9785777944b94a572}'
    environment:
      # Solana is the responder's other source chain and this stack has none. With it unset,
      # EnvConfig REQUIRES SOLANA_PRIVATE_KEY and PROGRAM_ID and the container refuses to start.
      DISABLE_SOLANA: 'true'
      VERBOSE: '${SIGNET_VERBOSE:-true}'
      # ── the operator's Sepolia endpoint ────────────────────────────────────
      # A SECRET (it carries the provider key). Empty here by design: up.sh refuses to bring the
      # profile up without it, naming the variable, before any container starts. It is also the
      # ONE value this fragment cannot derive from the chain.
      EVM_RPC_URL: '${SIGNET_EVM_RPC_URL:-}'
      # ── this stack's Midnight endpoints, over the compose network ──────────
      MIDNIGHT_NETWORK_ID: '${SIGNET_NETWORK_ID:-undeployed}'
      MIDNIGHT_NODE_URL: 'http://node:9944'
      MIDNIGHT_INDEXER_URL: 'http://indexer:8088/api/v4/graphql'
      MIDNIGHT_INDEXER_WS_URL: 'ws://indexer:8088/api/v4/graphql/ws'
      # THE EXPERIMENTAL PROOF SERVER, not the plain one: this stack compiles the Signet
      # singleton with --feature-zkir-v3 (images/aa-contracts/Dockerfile), so its verifier keys
      # are [v7] and a call proved against them needs the experimental build — the same reasoning
      # compose/aa.yml's header gives for aa-deploy and aa-console. NOT YET EXERCISED: this
      # profile raises no signing request on its own, and the 00034 stagenet run proved the same
      # responder against a PLAIN server on Sig Network's singleton. Overridable in one line
      # precisely because the two facts have not been reconciled — see questions Q11.
      MIDNIGHT_PROOF_SERVER_URL: '${SIGNET_PROOF_SERVER_URL:-http://aa-proof-server:6300}'
      # ── the responder's own Midnight wallet ────────────────────────────────
      # It pays the fees of its TWO contract writes per bridge leg (`respond`, then
      # `respondBidirectional`). Wallet `signet-responder` in wallets/wallets.json; up.sh funds it
      # (NIGHT + DUST registration) the way it funds the console relay wallet. A wallet of its own
      # rather than a shared one: the responder writes concurrently with everything else on the
      # stack, and two writers on one seed force each other's connection down (the ONE FACADE PER
      # SEED rule in wallets/wallets.json).
      MIDNIGHT_WALLET_SEED: '${SIGNET_RESPONDER_SEED:-51e751e751e751e751e751e751e751e751e751e751e751e751e751e751e751e7}'
      # The helper API's port INSIDE the container. It is also this service's health target: the
      # server starts it only after the Midnight monitor has connected, so an answer from it means
      # the responder is actually watching the singleton, not merely running.
      RESPONSES_API_PORT: '3040'
      # MPC_ROOT_KEY, MIDNIGHT_SIGNET_CONTRACT_ADDRESS and MIDNIGHT_CALLER_ALLOWLIST are
      # deliberately ABSENT: the entrypoint reads all three out of the `aa-out` volume, so they
      # cannot drift from the contracts this stack actually deployed, and the private root key
      # never appears in a compose file, in `docker inspect`, or in a process argument.
    volumes:
      # READ-ONLY: aa-deploy is the only writer of the receipt and of the root secret.
      - 'aa-out:/aa/out:ro'
    depends_on:
      node: { condition: service_healthy }
      indexer: { condition: service_healthy }
      aa-proof-server: { condition: service_started }
      # The vault and the singleton must exist before the allow-list can name them, and the root
      # secret is written by the same one-shot.
      aa-deploy: { condition: service_completed_successfully }
    healthcheck:
      # A real round trip to the responses API, not a port probe. 404 is the CORRECT answer for a
      # request id nothing has observed; what is being asserted is that the server answers at all,
      # which it only does after connectToMidnight() has returned. The image is
      # node:24-bookworm-slim — no curl, no wget — but node 24 has global fetch.
      test:
        - 'CMD'
        - 'node'
        - '-e'
        - >
          fetch("http://127.0.0.1:3040/responses/" + "0".repeat(64))
          .then((r) => { if (r.status !== 404 && r.status !== 200) process.exit(1); })
          .catch(() => process.exit(1));
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: 'unless-stopped'

# No `volumes:` here: this profile writes nothing of its own. The MPC root secret lives on the
# `aa-out` volume declared in compose/aa.yml, which is exactly where it should be — `./down.sh -v`
# removes that volume, so the root key rotates with the chain whose vault was initialised against
# it, and a stale key can never outlive the contracts it belongs to.
